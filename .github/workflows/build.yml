name: ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Build ibaal3105
        working-directory: ibaal3105
        run: |
          set -o pipefail

          rm -rf "$RUNNER_TEMP/ibaal3105-build.log"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ibaal3105-build.log"

      - name: Find application bundle
        working-directory: ibaal3105
        shell: bash
        run: |
          set -e

          echo "Searching Xcode output for application bundles..."

          APP=""

          while IFS= read -r line; do
            if [ -d "$line" ]; then
              APP="$line"
              break
            fi
          done < <(
            find \
              "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "*.app" \
              -print 2>/dev/null
          )

          if [ -z "$APP" ]; then
            echo "::error::xcodebuild completed but no .app bundle was produced."

            echo ""
            echo "=== Build products mentioned by Xcode ==="
            grep -E \
              "Build/Products|\.app|BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR" \
              "$RUNNER_TEMP/ibaal3105-build.log" \
              | tail -n 100 || true

            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

      - name: Create IPA
        working-directory: ibaal3105
        run: |
          set -e

          cd build

          rm -f ibaal3105-unsigned.ipa

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          test -f ibaal3105-unsigned.ipa

          echo "IPA:"
          ls -lh ibaal3105-unsigned.ipa

      - name: Inspect IPA
        working-directory: ibaal3105
        run: |
          set -e

          unzip -l build/ibaal3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error
