name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild \
            -list \
            -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned app
        run: |
          set -e

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate build output
        id: output
        shell: bash
        run: |
          set -e

          echo "Reading Xcode build settings..."

          SETTINGS=$(xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings)

          TARGET_DIR=$(echo "$SETTINGS" | \
            awk -F ' = ' '/TARGET_BUILD_DIR/ {print $2; exit}')

          FULL_PRODUCT=$(echo "$SETTINGS" | \
            awk -F ' = ' '/FULL_PRODUCT_NAME/ {print $2; exit}')

          echo "TARGET_BUILD_DIR:"
          echo "$TARGET_DIR"

          echo "FULL_PRODUCT_NAME:"
          echo "$FULL_PRODUCT"

          APP="$TARGET_DIR/$FULL_PRODUCT"

          if [ ! -d "$APP" ]; then
            echo "::error::Expected .app was not found."
            echo "Expected:"
            echo "$APP"

            echo ""
            echo "Searching fallback locations..."

            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo ""
          echo "================================"
          echo "APP FOUND"
          echo "================================"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Inspect application
        run: |
          set -e

          APP="${{ steps.output.outputs.app }}"

          echo "Application:"
          echo "$APP"

          echo ""
          echo "Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo ""
          echo "Application size:"
          du -sh "$APP"

      - name: Create unsigned IPA
        run: |
          set -e

          APP="${{ steps.output.outputs.app }}"

          rm -rf build
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo ""
          echo "================================"
          echo "UNSIGNED IPA CREATED"
          echo "================================"

          ls -lh ibaal3105-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "IPA contents:"
          unzip -l build/ibaal3105-unsigned.ipa

          echo ""
          echo "IPA size:"
          ls -lh build/ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-output
          path: ibaal3105/build/
          if-no-files-found: warn
