name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            || {
              echo "::error::xcodebuild failed"
              exit 1
            }

      - name: Locate application
        id: app
        shell: bash
        run: |
          set -e

          ROOT="$PWD/build/DerivedData"

          echo "Searching for iOS application..."

          APP=$(find "$ROOT" \
            -type d \
            -name "*.app" \
            -path "*Build/Products/*-iphoneos/*.app" \
            -print | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::No iOS .app found."

            echo "=== Build Products ==="
            find "$ROOT" \
              -type d \
              -path "*Build/Products/*" \
              -print || true

            echo "=== All .app bundles ==="
            find "$ROOT" \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "================================"
          echo "FOUND APP"
          echo "================================"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Inspect application
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          echo "App: $APP"

          echo ""
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo ""
          echo "App size:"
          du -sh "$APP"

      - name: Create unsigned IPA
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo "================================"
          echo "IPA CREATED"
          echo "================================"

          ls -lh ibaal3105-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          cd build

          unzip -l ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-output
          path: ibaal3105/build/
          if-no-files-found: warn
