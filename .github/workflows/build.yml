- name: Inspect project file
  working-directory: ibaal3105
  shell: bash
  run: |
    set -e

    echo "=== PROJECT FILES ==="
    find ThreeOneOSFive.xcodeproj -maxdepth 3 -type f -print

    echo ""
    echo "=== TARGET NAMES ==="
    grep -n "productName\|productType\|PRODUCT_NAME\|wrapper.application" \
      ThreeOneOSFive.xcodeproj/project.pbxproj \
      || true

    echo ""
    echo "=== BUILD CONFIGURATIONS ==="
    grep -n "XCBuildConfiguration\|PRODUCT_BUNDLE_IDENTIFIER" \
      ThreeOneOSFive.xcodeproj/project.pbxproj \
      | head -n 100
