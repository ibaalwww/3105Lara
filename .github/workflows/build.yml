name: Build ibaal3105

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Find Xcode project
        shell: bash
        run: |
          echo "=== XCODE PROJECTS ==="
          find . -maxdepth 6 -type d -name "*.xcodeproj" -print
          echo "======================"

      - name: Build ibaal3105
        shell: bash
        run: |
          set -o pipefail

          PROJECT="ibaal3105/ThreeOneOSFive.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Project tidak ditemukan:"
            echo "$PROJECT"
            echo ""
            echo "Project yang ditemukan:"
            find . -maxdepth 6 -type d -name "*.xcodeproj" -print
            exit 66
          fi

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project "$PROJECT" \
            -target ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       ACTUAL COMPILER ERRORS"
          echo "========================================"

          grep -nE \
            "error:|fatal error:|SwiftCompile|CompileSwift" \
            build.log \
            | tail -100 || true

          echo ""
          echo "========================================"
          echo "          BUILD SUMMARY"
          echo "========================================"

          tail -100 build.log

          echo ""
          echo "Build exit status: $STATUS"

          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-log
          path: build.log
          if-no-files-found: ignore
