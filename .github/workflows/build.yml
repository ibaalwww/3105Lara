name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild \
            -list \
            -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate app
        id: app
        shell: bash
        run: |
          set -e

          echo "Searching for built .app..."

          APP=$(find \
            build/DerivedData/Build/Products \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::Build completed but no .app was found."
            echo "Contents:"
            find build/DerivedData/Build/Products -maxdepth 4 -print
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R \
            "${{ steps.app.outputs.app }}" \
            build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo ""
          echo "================================"
          echo "Unsigned IPA created"
          echo "================================"
          ls -lh ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error
