name: Build ibaal3105

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Locate Xcode project
        shell: bash
        run: |
          echo "===== XCODE PROJECTS ====="
          find . -maxdepth 6 -type d -name "*.xcodeproj" -print
          echo "=========================="

      - name: Build ibaal3105
        shell: bash
        run: |
          set -o pipefail

          PROJECT="ibaal3105/ThreeOneOSFive.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Xcode project tidak ditemukan:"
            echo "$PROJECT"
            echo
            echo "Project yang ditemukan:"
            find . -maxdepth 6 -type d -name "*.xcodeproj" -print
            exit 66
          fi

          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project "$PROJECT" \
            -target ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          status=${PIPESTATUS[0]}

          echo ""
          echo "===== ACTUAL COMPILER ERRORS ====="

          grep -nE \
            "error:|fatal error:|SwiftCompile|CompileSwift" \
            build.log \
            | tail -100 \
            || true

          echo "===== END COMPILER ERRORS ====="

          echo ""
          echo "===== LAST BUILD LOG ====="
          tail -200 build.log
          echo "===== END BUILD LOG ====="

          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-log
          path: build.log
          if-no-files-found: ignore
