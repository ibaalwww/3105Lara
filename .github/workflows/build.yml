name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild \
            -list \
            -project ThreeOneOSFive.xcodeproj

      - name: Detect shared scheme
        id: scheme
        shell: bash
        run: |
          set -e

          SCHEME=$(
            xcodebuild \
              -list \
              -project ThreeOneOSFive.xcodeproj 2>/dev/null |
            awk '
              /^Schemes:/ {
                found=1
                next
              }
              found && NF {
                print $1
                exit
              }
            '
          )

          if [ -z "$SCHEME" ]; then
            echo "::error::No shared Xcode scheme was found."
            echo "The project must contain a shared .xcscheme."
            exit 1
          fi

          echo "Detected scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ibaal3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify archive
        run: |
          set -e

          APP=$(find \
            build/ibaal3105.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::No .app was produced."
            exit 1
          fi

          echo "Archived app:"
          echo "$APP"

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          APP=$(find \
            build/ibaal3105.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo "Created:"
          ls -lh ibaal3105-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-xcarchive
          path: ibaal3105/build/ibaal3105.xcarchive
          if-no-files-found: error
