      - name: Diagnose Xcode targets
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="
          xcodebuild \
            -list \
            -project ThreeOneOSFive.xcodeproj

          echo ""
          echo "===== BUILD SETTINGS ====="

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            | grep -E \
              '(^| )TARGET_NAME =|PRODUCT_NAME =|FULL_PRODUCT_NAME =|PRODUCT_TYPE =|WRAPPER_EXTENSION =|TARGET_BUILD_DIR =|CONFIGURATION_BUILD_DIR =' \
            || true
