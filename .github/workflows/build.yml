name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Inspect project
        run: |
          xcodebuild \
            -list \
            -project ThreeOneOSFive.xcodeproj

      - name: Detect target
        id: target
        shell: bash
        run: |
          set -e

          TARGET=$(
            xcodebuild \
              -list \
              -project ThreeOneOSFive.xcodeproj 2>/dev/null |
            awk '
              /^Targets:/ {
                found=1
                next
              }
              found && NF {
                print $0
                exit
              }
            '
          )

          if [ -z "$TARGET" ]; then
            echo "::error::No Xcode target found."
            exit 1
          fi

          echo "Detected target: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target "${{ steps.target.outputs.target }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/ibaal3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Find archived app
        id: app
        shell: bash
        run: |
          set -e

          APP=$(find \
            build/ibaal3105.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::Archive succeeded but no .app was found."
            exit 1
          fi

          echo "APP=$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "${{ steps.app.outputs.app }}" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo "IPA created:"
          ls -lh ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-xcarchive
          path: ibaal3105/build/ibaal3105.xcarchive
          if-no-files-found: error
