name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build ibaal3105
        run: |
          set -o pipefail

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Verify application
        run: |
          set -e

          APP="$PWD/build/Release-iphoneos/ibaal3105.app"

          if [ ! -d "$APP" ]; then
            echo "::error::ibaal3105.app was not produced."
            exit 1
          fi

          echo "APP FOUND:"
          echo "$APP"

          echo ""
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo ""
          echo "App size:"
          du -sh "$APP"

      - name: Create unsigned IPA
        run: |
          set -e

          APP="$PWD/build/Release-iphoneos/ibaal3105.app"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          test -f ibaal3105-unsigned.ipa

          echo "================================"
          echo "UNSIGNED IPA CREATED"
          echo "================================"

          ls -lh ibaal3105-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          cd build

          unzip -t ibaal3105-unsigned.ipa

          echo ""
          echo "IPA CONTENT:"
          unzip -l ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-log
          path: ibaal3105/build.log
          if-no-files-found: ignore
