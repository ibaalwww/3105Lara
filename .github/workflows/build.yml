name: Build ibaal3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ibaal3105

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -e

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -e

          echo "Searching for .app..."

          APP=$(find \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::No Release-iphoneos .app found."

            echo "Available applications:"
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf build
          mkdir -p build/Payload

          cp -R \
            "${{ steps.app.outputs.app }}" \
            build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            ibaal3105-unsigned.ipa \
            Payload

          echo "Created IPA:"
          ls -lh ibaal3105-unsigned.ipa

      - name: Inspect IPA
        run: |
          unzip -l build/ibaal3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-unsigned
          path: ibaal3105/build/ibaal3105-unsigned.ipa
          if-no-files-found: error
