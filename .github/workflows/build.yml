name: Build ibaal3105

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Locate project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 5 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
          echo "========================="

      - name: Build
        shell: bash
        run: |
          set -o pipefail

          PROJECT="ibaal3105/ThreeOneOSFive.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Project tidak ditemukan:"
            echo "$PROJECT"
            echo
            echo "Isi repo:"
            find . -maxdepth 4 -type d -name "*.xcodeproj" -print
            exit 66
          fi

          xcodebuild \
            -project "$PROJECT" \
            -target ibaal3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          status=${PIPESTATUS[0]}

          echo "===== ACTUAL COMPILER ERRORS ====="
          grep -nE "error:|fatal error:" build.log || true
          echo "===== END COMPILER ERRORS ====="

          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibaal3105-build-log
          path: build.log
